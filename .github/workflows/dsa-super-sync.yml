name: DSA Super-Sync (Organize & Mirror)
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Daily DSA Question/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: 'Asia/Kolkata' # Set timezone to India (IST)


permissions:
  contents: write

jobs:
  organize_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo (Account 1)
        uses: actions/checkout@v3
        with:
          path: source_repo
          fetch-depth: 0

      - name: Checkout Target Repo (Account 2)
        uses: actions/checkout@v3
        with:
          repository: merajalamcs27/Meraj-Alam_CS-2341348_IILM-GN
          token: ${{ secrets.SECONDARY_GITHUB_TOKEN }}
          path: target_repo

      - name: Organize Root and Flatten Folders
        run: |
          mkdir -p "source_repo/Daily DSA Question"
          cd source_repo
          
          # Move and Flatten folders created by Leethub
          last_moved=""
          detected_lang=""
          for dir in */; do
            foldername=${dir%/}
            if [[ "$foldername" != "Daily DSA Question" && "$foldername" != ".github" && "$foldername" != "Binary Trees" && "$foldername" != "Collection Framework" && "$foldername" != "Stack" && "$foldername" != "linkedlists" && "$foldername" != "a.1" && "$foldername" != "a.2" ]]; then
                codefile=$(find "$foldername" -maxdepth 1 -name "*.java" -o -name "*.py" -o -name "*.cpp" -o -name "*.c" | head -n 1)
                if [ -n "$codefile" ]; then
                    extension="${codefile##*.}"
                    newfilename="${foldername}.${extension}"
                    mv "$codefile" "Daily DSA Question/$newfilename"
                    last_moved="$foldername"
                    detected_lang="${extension^^}" # Capitalize extension (e.g. JAVA)
                    rm -rf "$foldername"
                else
                    mv "$foldername" "Daily DSA Question/"
                fi
            fi
          done

          # Move loose files from root
          find . -maxdepth 1 -name "*.java" -o -name "*.py" -o -name "*.cpp" -o -name "*.c" | while read file; do
             if [ "$file" != "./" ]; then
               filename=$(basename "$file")
               mv "$file" "Daily DSA Question/$filename"
               last_moved="${filename%.*}"
               ext="${filename##*.}"
               detected_lang="${ext^^}"
             fi
          done
          
          # Pass the variables to next steps
          echo "LAST_PROBLEM=$last_moved" >> $GITHUB_ENV
          echo "CURRENT_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Commit Organization to Account 1
        run: |
          cd source_repo
          git config user.email "organize-bot@github.com"
          git config user.name "Organize Bot"
          git add -A
          if git status | grep -q "Changes to be committed"; then
            if [ -n "${{ env.LAST_PROBLEM }}" ]; then
               git commit -m "${{ env.LAST_PROBLEM }} | ${{ env.CURRENT_TIME }}"
            else
               git commit -m "Organize: ${{ github.event.head_commit.message }}"
            fi
            git pull --rebase origin main
            git push origin main
          else
            echo "Account 1 is already up to date."
          fi

      - name: Sync and Streak to Account 2
        run: |
          mkdir -p target_repo/DSA
          cp -rv source_repo/Daily\ DSA\ Question/* target_repo/DSA/
          
          cd target_repo
          git config user.email "meraj.alam.cs27@iilm.edu"
          git config user.name "Meraj Alam"
          git add DSA/
          
          if git status | grep -q "Changes to be committed"; then
            if [ -n "${{ env.LAST_PROBLEM }}" ]; then
               git commit -m "${{ env.LAST_PROBLEM }} | ${{ env.CURRENT_TIME }}"
            else
               git commit -m "${{ github.event.head_commit.message }}"
            fi
            git pull --rebase origin main
            git push origin main
          else
            echo "Account 2 is already up to date."
          fi
