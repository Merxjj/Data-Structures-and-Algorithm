name: Sync and Streak Automation
on:
  push:
    branches:
      - main
    paths:
      - 'Daily DSA Question/**'
  workflow_dispatch: # This adds a manual "Run" button

jobs:
  sync_and_streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo (Account 1)
        uses: actions/checkout@v3
        with:
          path: source_repo

      - name: Checkout Target Repo (Account 2)
        uses: actions/checkout@v3
        with:
          repository: merajalamcs27/Meraj-Alam_CS-2341348_IILM-GN
          token: ${{ secrets.SECONDARY_GITHUB_TOKEN }}
          path: target_repo

      - name: Sync Folders and Set Streak Email
        run: |
          mkdir -p target_repo/dsa
          cp -rv source_repo/Daily\ DSA\ Question/* target_repo/dsa/
          
          cd target_repo
          git config user.email "meraj.alam.cs27@iilm.edu"
          git config user.name "Meraj Alam"
          
          git add dsa/
          
          if git status | grep -q "Changes to be committed"; then
            git commit -m "Manual/Auto Sync DSA question: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "No changes to sync."
          fi
