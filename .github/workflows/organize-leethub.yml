name: Organize LeetHub Submissions
on:
  push:
    branches:
      - main
    # Only trigger if changes happen in the root (ignore Daily DSA Question folder itself to avoid loops)
    paths-ignore:
      - 'Daily DSA Question/**'
      - '.github/**'
  workflow_dispatch: # Add manual trigger

permissions:
  contents: write  # Allow the bot to push reorganization changes

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move and Flatten LeetHub Submissions
        run: |
          mkdir -p "Daily DSA Question"
          
          # Move folders created by Leethub and flatten them
          for dir in */; do
            # Trim trailing slash
            foldername=${dir%/}
            
            # Skip our protected folders
            if [[ "$foldername" != "Daily DSA Question" && "$foldername" != ".github" && "$foldername" != "Binary Trees" && "$foldername" != "Collection Framework" && "$foldername" != "Stack" && "$foldername" != "linkedlists" && "$foldername" != "a.1" && "$foldername" != "a.2" ]]; then
                echo "Processing folder: $foldername"
                
                # Find the code file inside (java, py, cpp, c)
                # Note: We ignore README.md
                codefile=$(find "$foldername" -maxdepth 1 -name "*.java" -o -name "*.py" -o -name "*.cpp" -o -name "*.c" | head -n 1)
                
                if [ -n "$codefile" ]; then
                    extension="${codefile##*.}"
                    newfilename="${foldername}.${extension}"
                    echo "Moving and renaming: $codefile -> Daily DSA Question/$newfilename"
                    mv "$codefile" "Daily DSA Question/$newfilename"
                    # Clean up the now empty (or README-only) folder
                    rm -rf "$foldername"
                else
                    # If it's just a folder with no code (maybe just README), just move it as is
                    mv "$foldername" "Daily DSA Question/"
                fi
            fi
          done

          # Also move any loose code files already in root
          find . -maxdepth 1 -name "*.java" -o -name "*.py" -o -name "*.cpp" -o -name "*.c" | while read file; do
             if [ "$file" != "./" ]; then
               filename=$(basename "$file")
               mv "$file" "Daily DSA Question/$filename"
             fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.email "organize-bot@github.com"
          git config --global user.name "Organize Bot"
          
          git add "Daily DSA Question/"
          
          if git status | grep -q "Changes to be committed"; then
            git commit -m "Organize: Move LeetHub submission to Daily DSA Question"
            # Pull with rebase to handle any concurrent pushes (like from mirror bot)
            git pull --rebase origin main
            git push origin main
          else
            echo "Nothing to organize."
          fi
